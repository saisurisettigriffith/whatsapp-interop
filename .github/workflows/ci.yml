name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Build packages
        run: pnpm -r run build
  tests:
    runs-on: ubuntu-latest
    needs: lint-build
    steps:
      - uses: actions/checkout@v4
      - name: k6 placeholder
        run: echo "Add k6 load tests in tests/load" 
